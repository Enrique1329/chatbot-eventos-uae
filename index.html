<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventBot UAE</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #4a6fa5, #6b8cbf);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      text-align: center;
    }
    p {
      max-width: 500px;
      opacity: 0.9;
      text-align: center;
    }
    df-messenger {
      --df-messenger-bot-message: #eef2f9;
      --df-messenger-user-message: #2563eb;
      --df-messenger-font-color: #1f2937;
      --df-messenger-button-titlebar-color: #2563eb;
      --df-messenger-chat-background-color: #f7f9fc;
      --df-messenger-send-icon: #2563eb;
      --df-messenger-input-box-color: #ffffff;
      --df-messenger-input-font-color: #1f2937;
      --df-messenger-input-placeholder-font-color: #9aa5b1;
      --df-messenger-minimized-chat-close-icon-color: #2563eb;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>ChatBot de Eventos Académicos</h1>
  <p>Haz clic en el ícono de chat en la esquina inferior derecha para hablar con el asistente virtual.</p>
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
  <df-messenger
    intent="WELCOME"
    chat-title="EventBotㅤUAE"
    agent-id="e994580c-e3b3-471e-a686-e7fb1ab14d6c"
    language-code="es"
  ></df-messenger>
</body>
</html>
